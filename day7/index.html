<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>if-else conditions</title>
  </head>
  <body>
    <script>
    let num=prompt("enter a number")
      if(num>0){
       console.log(`${num} is positive number`)
      }
      else{
        console.log(`${num} is negative number`)
      }
    </script>
  </body>
</html>
