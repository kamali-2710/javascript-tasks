<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String Task</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <form action="">
      <h2>Content</h2>
      <textarea name="name" id="name" cols="50" rows="7"></textarea>
      <div class="click">
        <button onclick="answer()" type="button">submit</button>
        <button type="reset"onclick="resetbtn()" class="reset">Reset</button>
      </div>
      <div class="div">
        <p id="total"></p>
        <p id="upper"></p>
        <p id="lower"></p>
        <p id="special"></p>
      </div>
    </form>
    <script>
       let answer = () => {
      let upper = 0;
      let lower = 0;
      let spcl = 0;
        let a = document.getElementById("name").value;
        //  debugger
        let Total = a.length;
        document.getElementById("total").innerText = `Total = ${Total}`;

        for (let i = 0; i < Total; i++) {
          let b = a.charCodeAt(i);
          if (b >= 65 && b <= 90) {
            upper += 1;
          } 
          else if (b >= 97 && b <= 122) {
            lower += 1;
          } 
          else if (
            (b >= 32 && b <= 47) ||
            (b >= 58 && b <= 64) ||
            (b >= 91 && b <= 96) ||
            (b >= 125 && b <= 127)
          ) {
            spcl += 1;
          }
          document.getElementById("upper").innerText = `UpperCase = ${upper}`;
          document.getElementById("lower").innerText = `LowerCase = ${lower}`;
          document.getElementById("special").innerText = `Special characters = ${spcl}`;
        }
      };
      let resetbtn=()=>{
         document.getElementById("total").innerText="";
        document.getElementById("upper").innerText="";
        document.getElementById("lower").innerText="";
        document.getElementById("special").innerText="";
      }
    </script>
  </body>
</html>
