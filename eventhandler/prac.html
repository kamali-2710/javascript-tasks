<!DOCTYPE html>
<html>
<head>
  <title>Window Location Properties</title>
</head>
<body>

<h2>Window Location Properties</h2>

<button onclick="showLocation()">Show Location Details</button>

<p id="output"></p>

<script>
  function showLocation() {
    let text = "";

    text += "Hash: " + window.location.hash + "<br>";
    text += "Host: " + window.location.host + "<br>";
    text += "Hostname: " + window.location.hostname + "<br>";
    text += "Href: " + window.location.href + "<br>";
    text += "Origin: " + window.location.origin + "<br>";
    text += "Pathname: " + window.location.pathname + "<br>";
    text += "Port: " + window.location.port + "<br>";
    text += "Protocol: " + window.location.protocol + "<br>";
    text += "Search: " + window.location.search + "<br>";

    document.getElementById("output").innerHTML = text;
  }

</script>

</body>
</html>
