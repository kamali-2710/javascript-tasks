    document.writeln("<br><br><h2>Heart Pattern<h2>")
      //heart pattern
      for(let r=1;r<=9;r++){
        for(let c=1;c<=9;c++){

        if((r==1)&&(c!=1)&&(c!=5)&&(c!=9)){
          document.writeln("*&nbsp;")
        }
        else if((r==2||r==8)&&(c==5)){
          document.writeln("*&nbsp;")
        }
        else if((r==2||r==3||r==4)&&(c==1||c==9)){
          document.writeln("*&nbsp;")
        }    
        else if((r==5)&&(c==2||c==8)){
          document.writeln("*&nbsp;")
        }
        else if((r==6)&&(c==3||c==7)){ 
          document.writeln("*&nbsp;")
        }
        else if((r==7)&&(c==4||c==6)){
          document.writeln("*&nbsp;")
        }
        else{ 
          document.writeln("&nbsp; &nbsp;")
        }
      }
       document.writeln("<br>")
    }

   //77 pattern
    for(let r=1;r<=6;r++){

 document.writeln("<br><br><h2>bar Pattern<h2>")

    //bar pattern
    for(let r=1;r<=9;r++){
        for(let c=1;c<=9;c++){

        if((r==1)||(r==9)||(c==1)){
          document.writeln("*&nbsp;")
        }
         else if((r==3)&&(c!=8&&c!=9)){
          document.writeln("*&nbsp;")

        }

        }

        }
      }

    }

    document.writeln("<br><br><h2>House Pattern<h2>")

    //house pattern
    for(let r=1;r<=9;r++){
        for(let c=1;c<=9;c++){

        if((r==1)&&(c==5)){
          document.writeln("*")
        }
         else if((r==2)&&(c==4||c==6)){
          document.writeln("*&nbsp;")
        }
        else if((r==3)&&(c==3||c==7)){
          document.writeln("*&nbsp;")
        }
        else if((r==4)&&(c==2||c==8)){
          document.writeln("*&nbsp;")
        }
        else if((r==5||r==9)){
          document.writeln("*&nbsp;")
        }
         else if((r==5||r==6||r==7||r==8)&&(c==1||c==9)){
          document.writeln("*&nbsp;")
        }
