<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd or even</title>
</head>
<body>
    <script>


    let a=prompt("enter a number")
      if(a%2==0){
       console.log(`${a} even number`)
      }
      else{
        console.log(`${a} odd number`)
      }
    </script>
</body>
</html>
