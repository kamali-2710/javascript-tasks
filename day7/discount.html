<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discount</title>
</head>
<body>
    <script>
        let price=prompt("enter the price")
        if(price>=100){
           let discount= price*10/100
            let total= price-discount
             console.log(`you will get discount ${discount}%`)
             console.log(`your price amount is Rs.${total}`)  
        }
        else{
            console.log("you are not eligible for this discount")
        }
        
    </script>
</body>
</html>
